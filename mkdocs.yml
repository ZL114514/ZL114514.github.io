site_name: ZL114514 的博客
site_url: https://blog.maimaidx-net.top/
site_description: 折腾记录 · 笔记 · 随笔
site_author: ZL114514

# 源码在 src/，构建产物输出到 docs/（GitHub Pages 从这里发布）
docs_dir: src
site_dir: docs

theme:
  name: material
  language: zh
  font: false          # 关键：不请求 Google Fonts，用系统字体，国内不会卡在字体加载
  icon:
    logo: material/notebook-outline
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 浅色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 深色模式

nav:
  - 首页: index.md
  - 博客: blog/index.md
  - 碎碎念:
      - 最新: notes/index.md
      # <<notes-nav>>
      - 2026 年 10 月: notes/2026-10/index.md
      - 2026 年 9 月: notes/2026-09/index.md
      - 2026 年 8 月: notes/2026-08/index.md
      - 2026 年 7 月: notes/2026-07/index.md
      - 2026 年 6 月: notes/2026-06/index.md
      - 2026 年 5 月: notes/2026-05/index.md
      - 2026 年 4 月: notes/2026-04/index.md
      - 2026 年 3 月: notes/2026-03/index.md
      - 2026 年 2 月: notes/2026-02/index.md
      - 2026 年 1 月: notes/2026-01/index.md
      - 2025 年 12 月: notes/2025-12/index.md
      - 2025 年 11 月: notes/2025-11/index.md
      - 2025 年 10 月: notes/2025-10/index.md
      - 2025 年 9 月: notes/2025-09/index.md
      - 2025 年 8 月: notes/2025-08/index.md
      - 2025 年 7 月: notes/2025-07/index.md
      - 2025 年 6 月: notes/2025-06/index.md
      - 2025 年 5 月: notes/2025-05/index.md
      - 2025 年 4 月: notes/2025-04/index.md
      - 2025 年 3 月: notes/2025-03/index.md
      - 2025 年 2 月: notes/2025-02/index.md
      - 2025 年 1 月: notes/2025-01/index.md
# <</notes-nav>>
  - 成绩库: record/index.md
  - 关于: about/index.md

plugins:
  - search:
      lang:
        - zh
        - en
  - blog:
      blog_dir: blog
      post_date_format: yyyy-MM-dd
      post_url_format: "{date}/{slug}"
      post_url_date_format: yyyy/MM/dd
      archive: true
      archive_name: 归档
      archive_date_format: yyyy 年
      categories: true
      categories_name: 分类
      authors: true
      authors_file: "{blog}/.authors.yml"
      pagination: true
      pagination_per_page: 10
      post_excerpt: optional
      post_readtime: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css
  - stylesheets/md3-expressive.css
  - stylesheets/tg-reactions.css
  - stylesheets/notes.css

extra_javascript:
  - javascripts/tg-reactions.js
  - javascripts/notes.js

extra:
  generator: false

